<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B4472A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brique">
<meta name="description" content="Brique — gère tes dépenses chaque jour et construis ton rêve, brique par brique.">
<title>Brique</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF5EE; --card:#FFFFFF; --ink:#1C1917; --muted:#6B635A; --line:#EADFD2;
  --brick:#B4472A; --brick2:#C25A3A; --brickDark:#8F3520; --soft:#F3E6DA; --empty:#EFE5D8;
  --flame:#D9861E; --night:#1C1917; --night2:#26221F; --night3:#36302B; --nightMuted:#B5ACA2; --gold:#F0B86A;
  --display:'Bricolage Grotesque', 'Inter', system-ui, sans-serif;
  --body:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:var(--brick)}
.shell{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 160px) 20px;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.display{font-family:var(--display);letter-spacing:-0.02em}
.h1{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-0.02em;margin:0}
.h2{font-family:var(--display);font-size:19px;font-weight:700;margin:0}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 10px;font-weight:700;font-size:15px}
.btn{border:none;border-radius:18px;min-height:52px;padding:0 20px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-dark{background:var(--ink);color:#fff}
.btn-brick{background:var(--brick);color:#fff}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn-light{background:#FAF5EE;color:var(--ink)}
.btn-block{width:100%}
.btn[disabled]{background:#7A7168;color:#fff;cursor:not-allowed}
.link{background:none;border:none;color:var(--brick);font-weight:600;font-size:14px;padding:10px 0;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.hero{background:var(--brick);color:#fff;border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;border:none;text-align:left;width:100%}
.hero .amount{font-family:var(--display);font-size:62px;font-weight:800;letter-spacing:-0.04em;line-height:1}
.hero .unit{font-family:var(--display);font-size:26px;font-weight:700}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:#fff;border-radius:999px}
.hero-bricks{position:absolute;right:-18px;top:-14px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:120px;opacity:.16}
.hero-bricks span{height:22px;background:#fff;border-radius:4px}
.banner{border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;border:none;width:100%;text-align:left;font-size:15px}
.banner.night{background:var(--night);color:#fff}
.banner.soft{background:var(--soft);color:var(--ink)}
.item{display:flex;align-items:center;gap:12px;padding:9px 0;border:none;background:none;width:100%;text-align:left;font-size:15px}
.tile{width:40px;height:40px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--brickDark);flex-shrink:0}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(env(safe-area-inset-bottom) + 10px);z-index:5}
.nav-in{display:flex;justify-content:space-around;width:100%;max-width:440px}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);min-width:64px;min-height:48px;padding:4px}
.nav button[aria-current="page"]{color:var(--brick)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 78px);width:calc(100% - 40px);max-width:400px;z-index:4;box-shadow:0 8px 24px rgba(28,25,23,.18)}
.wall{display:flex;flex-direction:column;gap:4px}
.wall .r{display:flex;gap:4px}
.wall .b{flex:2;border-radius:3px;background:var(--empty)}
.wall .b.h{flex:1}
.wall .b.f{background:var(--brick)}
.wall .b.f2{background:var(--brick2)}
.wall .b.new{animation:drop .55s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i) * 70ms)}
@keyframes drop{from{transform:translateY(-26px) scale(.7);opacity:0}to{transform:none;opacity:1}}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps .s{display:flex;flex-direction:column;gap:5px}
.steps .s i{height:6px;border-radius:999px;background:var(--line)}
.steps .s.done i{background:var(--brick)}
.steps .s.now i{background:#E2A48C}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:19px;font-weight:800}
.insight{background:var(--night);color:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center}
.catbar{height:8px;background:var(--empty);border-radius:999px;overflow:hidden}
.catbar i{display:block;height:100%;background:var(--brick);border-radius:999px}
/* sheets */
.overlay{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;background:rgba(28,25,23,.35);animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);width:100%;max-width:440px;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 20px);gap:14px;overflow-y:auto;animation:up .25s cubic-bezier(.2,.9,.3,1) both}
.sheet.dark{background:var(--night);color:#FAF5EE}
.sheet.dark .muted{color:var(--nightMuted)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.amountbig{font-family:var(--display);font-size:64px;font-weight:800;letter-spacing:-0.04em;line-height:1}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:54px;border-radius:16px;border:none;background:#fff;font-family:var(--display);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pad button:active{background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:2px 20px 4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .pill{flex-shrink:0}
.sheet .pad button{height:50px}
.sheet .amountbig{font-size:56px}
.pill{border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-size:14px;font-weight:600;min-height:44px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.pill small{font-size:11px;font-weight:500;opacity:.8}
.pill[aria-pressed="true"]{background:var(--brick);border-color:var(--brick);color:#fff}
.sugg{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px dashed #D9A58E;border-radius:18px;padding:11px 14px;text-align:left;width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{border:1px solid var(--line);background:#fff;border-radius:14px;min-height:50px;padding:0 14px;width:100%}
.input:focus{outline:2px solid var(--brick);outline-offset:1px}
.option{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;width:100%;font-size:15px}
.option[aria-pressed="true"]{border-color:var(--brick);background:#FBEDE6}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dots div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--nightMuted)}
.dots i{width:34px;height:34px;border-radius:12px;border:1.5px solid #4A423B}
.dots i.on{background:var(--brick);border-color:var(--brick)}
.dots i.jk{background:transparent;border-color:var(--gold);border-style:dashed}
.dots i.today{border-color:var(--gold)}
.dots i.today.on{background:var(--gold);border-color:var(--gold)}
.nightcard{background:var(--night2);border-radius:20px;padding:14px 16px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 40px);box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .2s both}
.dialog{position:fixed;inset:0;z-index:30;background:rgba(28,25,23,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.dialog .box{background:#fff;border-radius:24px;padding:20px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;animation:up .2s both}
.loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted)}
.loadbricks{display:grid;grid-template-columns:repeat(3,24px);gap:5px}
.loadbricks span{height:14px;border-radius:3px;background:var(--brick);animation:drop .8s infinite alternate}
.loadbricks span:nth-child(2){animation-delay:.15s}.loadbricks span:nth-child(3){animation-delay:.3s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.big-plus{font-family:var(--display);font-size:84px;font-weight:800;letter-spacing:-0.05em;line-height:.95;color:var(--gold)}
.mini-bricks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:240px}
.mini-bricks span{height:26px;border-radius:4px;background:var(--brick)}
.mini-bricks span:nth-child(3n){background:var(--brick2)}
.mini-bricks span.new{animation:drop .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i) * 90ms)}
.warn{background:#FFF4E5;border:1px solid #F3D3A6;border-radius:16px;padding:10px 14px;font-size:13px;color:#5C3D0E}
hr.sep{border:none;border-top:1px solid var(--line);margin:4px 0}
.list-head{padding-top:6px}
.install{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 142px);width:calc(100% - 40px);max-width:400px;z-index:15;background:var(--ink);color:#fff;border-radius:18px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .2s both}
.install b{display:block;font-size:15px}.install span{font-size:12.5px;color:var(--nightMuted)}
.install .btn{min-height:40px;padding:0 14px;font-size:14px}
.install .x{background:none;border:none;color:var(--nightMuted);font-size:22px;width:36px;height:40px}
textarea.input{padding:12px 14px;min-height:110px;font-size:13px;font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="loadbricks"><span></span><span></span><span></span></div><span>Chargement de ton chantier…</span></div></div>
<div id="sheet"></div>
<div id="dialog"></div>
<div id="toast" aria-live="polite"></div>
<div id="install"></div>
<script>
'use strict';
/* =========================================================
   Brique — gestion des dépenses quotidienne et motivante
   Données : stockage Claude (par personne) si disponible,
   sinon stockage local de l'appareil.
   ========================================================= */

/* ---------- Constantes ---------- */
const CATS = [
  { id: 'transport', n: 'Transport', s: 'Zem, taxi, carburant' },
  { id: 'nourriture', n: 'Nourriture', s: 'Repas, petit-déj' },
  { id: 'telephone', n: 'Téléphone', s: 'Crédit, internet' },
  { id: 'courses', n: 'Courses', s: 'Marché, boutique' },
  { id: 'famille', n: 'Famille', s: 'Aide, cadeaux' },
  { id: 'maison', n: 'Maison', s: 'Eau, électricité' },
  { id: 'sante', n: 'Santé', s: 'Pharmacie, soins' },
  { id: 'sorties', n: 'Sorties', s: 'Loisirs, sorties' },
  { id: 'business', n: 'Business', s: 'Outils, pro' },
  { id: 'etudes', n: 'Études', s: 'Photocopies, fournitures' },
  { id: 'autre', n: 'Autre', s: '' }
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
/* Catégories créées par la personne (profil.cats). Une catégorie retirée garde son nom pour l'historique. */
function myCats() { return (S.profile && S.profile.cats) || []; }
function catList() { return CATS.slice(0, -1).filter(c => !(c.id === 'business' && S.profile && isStudent(S.profile.mode))).map(c => catOf(c.id)).concat(myCats().filter(c => !c.off), CATS.slice(-1)); }
const SCHOOL_CAT = { id: 'etudes', n: 'École', s: 'Fournitures, photocopies' };
const isLyceen = () => !!(S.profile && S.profile.mode === 'lyceen');
function catOf(id) { if (id === 'etudes' && isLyceen()) return SCHOOL_CAT; return CAT[id] || myCats().find(c => c.id === id) || CAT.autre; }
const DEFAULT_SHORTCUTS = [
  { c: 'transport', a: 500 }, { c: 'nourriture', a: 1500 }, { c: 'telephone', a: 1000 },
  { c: 'nourriture', a: 500 }, { c: 'courses', a: 2000 }, { c: 'transport', a: 300 }
];
const INCOME_SRC = [
  { id: 'salaire', n: 'Salaire' }, { id: 'freelance', n: 'Freelance' }, { id: 'business', n: 'Business' },
  { id: 'cadeau', n: 'Cadeau' }, { id: 'autre', n: 'Autre' }
];
const INCOME_SRC_ETU = [
  { id: 'parents', n: 'Parents, famille' }, { id: 'bourse', n: 'Bourse' }, { id: 'job', n: 'Petit job' },
  { id: 'cadeau', n: 'Cadeau' }, { id: 'autre', n: 'Autre' }
];
/* Profils : salaire, irrégulier, mixte, étudiant (argent des parents, bourse, petits jobs). */
/* Étudiant ou élève du lycée : argent des parents, rythme choisi (jour, semaine, mois). */
const isStudent = m => m === 'etudiant' || m === 'lyceen';
/* Rythme de l'argent reçu : 'jour', 'semaine' (payWeekday, 0 = dimanche), 'mois' (payDay) ou null (ça varie).
   Seul l'étudiant choisit son rythme ; les salariés sont payés au mois. */
function freqOf(o) {
  if (o.mode === 'irregulier') return null;
  if (isStudent(o.mode)) {
    if (o.freq === 'jour') return 'jour';
    if (o.freq === 'semaine') return o.payWeekday != null ? 'semaine' : null;
    if (o.freq === 'varie') return null;
    return o.payDay ? 'mois' : null;
  }
  return o.payDay ? 'mois' : null;
}
const noFixed = o => !freqOf(o);
function nextIncomeDate(o, from) {
  const f = freqOf(o);
  if (f === 'jour') return addDays(from, 1);
  if (f === 'semaine') { const n = (o.payWeekday - parseDay(from).getDay() + 7) % 7; return addDays(from, n || 7); }
  if (f === 'mois') return nextPayDate(o.payDay, from);
  return null;
}
function freqLabel(o) {
  const f = freqOf(o);
  return f === 'jour' ? 'argent reçu chaque jour' : f === 'semaine' ? 'argent reçu chaque ' + DAYS[o.payWeekday] : f === 'mois' ? 'argent reçu vers le ' + o.payDay + ' du mois' : 'sans date fixe';
}
const incomeSrcs = m => isStudent(m) ? INCOME_SRC_ETU : INCOME_SRC;
/* Les rentrées qui ouvrent une nouvelle période (comme une paie). */
const mainSrcs = m => isStudent(m) ? ['parents', 'bourse'] : ['salaire'];
const payWord = m => isStudent(m) ? 'à chaque fois que tu reçois de l’argent' : m === 'irregulier' ? 'à chaque rentrée d’argent' : 'à chaque paie';
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DAYS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
let IS_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');

/* ---------- Utilitaires ---------- */
const pad2 = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function fmt(n) {
  n = Math.round(Number(n) || 0);
  const s = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (n < 0 ? '−' : '') + s;
}
const F = n => fmt(n) + ' F';
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
/* Une « journée » va de 4 h à 4 h : une dépense à 1 h du matin compte pour la veille. */
function dayKey(date) { return ymd(new Date((date ? new Date(date) : new Date()).getTime() - 4 * 3600e3)); }
const today = () => dayKey(new Date());
function parseDay(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseDay(s); d.setDate(d.getDate() + n); return ymd(d); }
function diffDays(a, b) { const A = parseDay(a), B = parseDay(b); return Math.round((Date.UTC(B.getFullYear(), B.getMonth(), B.getDate()) - Date.UTC(A.getFullYear(), A.getMonth(), A.getDate())) / 864e5); }
function weekStart(s) { const d = parseDay(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return ymd(d); }
function longDate(s) { const d = parseDay(s); return DAYS[d.getDay()].replace(/^./, c => c.toUpperCase()) + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function shortDate(s) { const d = parseDay(s); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function monthLabel(k) { const [y, m] = k.split('-').map(Number); return MONTHS[m - 1].replace(/^./, c => c.toUpperCase()) + ' ' + y; }
function roughDate(s) { const d = parseDay(s); const p = d.getDate() <= 10 ? 'début ' : d.getDate() <= 20 ? 'mi-' : 'fin '; return p + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
function hhmm(t) { const d = new Date(t); return pad2(d.getHours()) + 'h' + pad2(d.getMinutes()); }
const floor50 = n => Math.max(0, Math.floor(n / 50) * 50);
const sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);
function nextPayDate(payDay, fromDay) {
  /* prochaine date de paie strictement après fromDay */
  const d = parseDay(fromDay);
  let y = d.getFullYear(), m = d.getMonth();
  for (let i = 0; i < 3; i++) {
    const last = new Date(y, m + 1, 0).getDate();
    const cand = ymd(new Date(y, m, Math.min(payDay, last)));
    if (cand > fromDay) return cand;
    m++; if (m > 11) { m = 0; y++; }
  }
  return addDays(fromDay, 30);
}

/* ---------- Stockage ---------- */
const Store = {
  mode: 'local', db: null, uid: null, queues: {}, note: '', readOnly: false,
  async init() {
    let inFrame = false; try { inFrame = window.top !== window.self; } catch (e) { inFrame = true; }
    for (let i = 0; !IS_CLAUDE && inFrame && i < 20; i++) { await sleep(100); IS_CLAUDE = !!(window.claude && typeof window.claude.use === 'function'); }
    if (IS_CLAUDE) {
      try {
        const res = await Promise.race([
          Promise.all([window.claude.use('db'), window.claude.use('user')]),
          sleep(12000).then(() => null)
        ]);
        if (res && res[0] && res[1]) {
          const id = await res[1].id();
          if (id) { this.db = res[0]; this.uid = id; this.mode = 'cloud'; }
        }
      } catch (e) { /* on reste en local */ }
      if (this.mode !== 'cloud') this.note = 'Sauvegarde en ligne indisponible : tes données restent sur cet appareil pour l’instant.';
    }
    if (this.mode === 'local') {
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    }
  },
  path(id) { return 'data/users/' + this.uid + '/' + id; },
  async loadAll() {
    const out = {};
    if (this.mode === 'cloud') {
      const snap = await Promise.race([
        this.db.collection('data/users/' + this.uid).get(),
        sleep(12000).then(() => { throw { code: 'timeout' }; })
      ]);
      snap.docs.forEach(d => { if (d.exists) out[d.id] = clone(d.data()); });
    } else {
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.indexOf('brique:') === 0) out[k.slice(7)] = JSON.parse(localStorage.getItem(k));
        }
      } catch (e) { this.note = 'Le stockage de cet appareil est bloqué : tes données ne seront pas gardées.'; }
    }
    return out;
  },
  save(id, data) {
    const body = clone(data);
    if (this.mode === 'local') {
      try { localStorage.setItem('brique:' + id, JSON.stringify(body)); }
      catch (e) { toast('Impossible d’enregistrer sur cet appareil.'); }
      return;
    }
    if (this.readOnly) return;
    const q = this.queues[id] || (this.queues[id] = { busy: false, next: null });
    q.next = body;
    if (!q.busy) this.flush(id);
  },
  async flush(id) {
    const q = this.queues[id]; q.busy = true;
    while (q.next) {
      const body = q.next; q.next = null;
      try { await this.db.doc(this.path(id)).set(body); }
      catch (e) {
        if (e && e.code === 'unavailable') {
          await sleep(700 + Math.random() * 900);
          try { await this.db.doc(this.path(id)).set(body); } catch (e2) { this.fail(e2); }
        } else this.fail(e);
      }
    }
    q.busy = false;
  },
  async remove(id) {
    if (this.mode === 'local') { try { localStorage.removeItem('brique:' + id); } catch (e) {} return; }
    try { await this.db.doc(this.path(id)).delete(); } catch (e) { this.fail(e); }
  },
  fail(e) {
    const c = e && e.code;
    if (c === 'invalid_argument' || c === 'not_granted' || c === 'revoked') { this.readOnly = true; toast('Enregistrement impossible ici : demande l’accès « Contributeur » ou installe ta propre copie.'); }
    else if (c === 'quota_exceeded') toast('Espace de sauvegarde plein : exporte puis supprime d’anciens mois.');
    else toast('Pas de connexion : réessaie dans un instant.');
  }
};

/* ---------- État ---------- */
const S = {
  profile: null,
  months: {},
  ui: { tab: 'home', sheet: null, form: {}, month: null, dialog: null }
};
function mk(day) { return day.slice(0, 7); }
function month(k) {
  return S.months[k] || (S.months[k] = { expenses: [], incomes: [], deposits: [], closes: {}, adjustments: [] });
}
function saveMonth(k) { Store.save('m-' + k, S.months[k]); }
function saveProfile() { Store.save('profile', S.profile); }
function all(kind) { let r = []; for (const k in S.months) r = r.concat(S.months[k][kind] || []); return r; }
function allCloses() { const o = {}; for (const k in S.months) Object.assign(o, S.months[k].closes || {}); return o; }

/* ---------- Calculs (règles du cahier des charges, section 5) ---------- */
function balance() {
  return sum(all('incomes'), x => x.a) + sum(all('adjustments'), x => x.a)
    - sum(all('expenses'), x => x.a) - sum(all('deposits'), x => x.a);
}
function chargeStart() {
  /* Les charges fixes sont mensuelles : on suit la paie si elle est au mois, sinon le mois calendaire. */
  return freqOf(S.profile) === 'mois' ? S.profile.periodStart : today().slice(0, 8) + '01';
}
function chargePaid(c) {
  const start = chargeStart();
  if (S.profile.chargesPaidInit && S.profile.chargesPaidInit[c.id] && S.profile.chargesPaidInit[c.id] >= start) return true;
  return all('expenses').some(e => e.charge === c.id && e.day >= start);
}
function cRest() { return sum((S.profile.charges || []).filter(c => !chargePaid(c)), c => c.amount); }
function goal() { return S.profile.goal && !S.profile.goal.done ? S.profile.goal : null; }
function eRest(excludeEveningOf) {
  const g = goal(); if (!g || !g.per) return 0;
  const since = sum(all('deposits').filter(d => d.goal === g.id && d.day >= S.profile.periodStart && !(d.kind === 'evening' && d.day === excludeEveningOf)), d => d.a);
  return Math.max(0, g.per - since);
}
function daysLeft() {
  const nx = S.profile.nextIncome;
  if (!nx) return 30;
  const d = diffDays(today(), nx);
  if (d <= 0) return freqOf(S.profile) === 'jour' ? 1 : 7;
  return d;
}
function incomeOverdue() { const nx = S.profile.nextIncome; return !!nx && diffDays(today(), nx) <= 0; }
function spentOn(day) { return sum(all('expenses').filter(e => e.day === day && !e.charge), e => e.a); }
function budgetCalc() {
  const d = today();
  const evening = sum(all('deposits').filter(x => x.day === d && x.kind === 'evening'), x => x.a);
  const base = balance() + spentOn(d) + evening;
  const c = cRest(), e = eRest(d), n = daysLeft();
  const avail = base - c - e;
  return { base, c, e, n, avail, b: floor50(avail / n) };
}
function budgetToday() {
  const cl = allCloses()[today()];
  return cl ? cl.b : budgetCalc().b;
}
function tomorrowBudget() {
  const n = Math.max(1, daysLeft() - 1);
  const avail = balance() - cRest() - eRest(null);
  return floor50(avail / n);
}
function goalStats() {
  const g = goal();
  if (!g) return null;
  const v = S.profile.brickValue || 200;
  const p = sum(all('deposits').filter(d => d.goal === g.id), d => d.a);
  const pct = g.target > 0 ? Math.min(100, Math.floor(p / g.target * 100)) : 0;
  const t = today();
  const deps = all('deposits').filter(d => d.goal === g.id);
  const firstDay = deps.length ? deps.map(d => d.day).sort()[0] : null;
  const span = firstDay ? Math.min(14, diffDays(firstDay, t) + 1) : 0;
  const recent = span >= 7 ? sum(deps.filter(d => d.a > 0 && diffDays(d.day, t) < span && diffDays(d.day, t) >= 0), d => d.a) / span : 0;
  const left = Math.max(0, g.target - p);
  const eta = recent > 0 && left > 0 ? addDays(t, Math.ceil(left / recent)) : null;
  const exact = g.target > 0 ? Math.max(0, Math.min(100, p / g.target * 100)) : 0;
  return { g, p, pct, exact, bricks: Math.floor(Math.max(0, p) / v), left, eta, v, waiting: !!firstDay && span < 7 };
}
function streakInfo() {
  const closes = allCloses();
  const t = today();
  const first = S.profile.createdDay || t;
  let d = closes[t] ? t : addDays(t, -1);
  let count = 0; const jokers = {};
  while (d >= first) {
    if (closes[d]) count++;
    else {
      const w = weekStart(d);
      const earlier = Object.keys(closes).some(k => k < d);
      if (!jokers[w] && earlier) jokers[w] = d;
      else break;
    }
    d = addDays(d, -1);
  }
  const record = Math.max(S.profile.record || 0, count);
  return { count, record, jokers };
}
function jokerUsedThisWeek() {
  const info = streakInfo(); const w = weekStart(today());
  return !!info.jokers[w];
}
function minutesOf(t) { const d = new Date(t); return d.getHours() * 60 + d.getMinutes(); }
function isWeekend(t) { const g = new Date(t).getDay(); return g === 0 || g === 6; }
function suggestion() {
  const now = new Date(); const nowM = minutesOf(now); const we = isWeekend(now);
  const t = today(); const since = addDays(t, -30);
  const inSlot = e => Math.abs(minutesOf(e.t) - nowM) <= 45 && isWeekend(e.t) === we;
  const exps = all('expenses').filter(e => !e.charge && e.day >= since && e.day < t && inSlot(e));
  if (exps.length < 3) return null;
  const groups = {};
  exps.forEach(e => { const k = e.c + '|' + e.a; groups[k] = (groups[k] || 0) + 1; });
  let best = null;
  for (const k in groups) if (!best || groups[k] > best.n) best = { k, n: groups[k] };
  if (!best || best.n < 3 || best.n / exps.length < 0.6) return null;
  const [c, a] = best.k.split('|');
  const already = all('expenses').some(e => e.day === t && e.c === c && e.a === Number(a) && inSlot(e));
  if (already) return null;
  return { c, a: Number(a), n: best.n };
}
function shortcuts() {
  const since = addDays(today(), -30);
  const groups = {};
  all('expenses').filter(e => !e.charge && e.day >= since).forEach(e => { const k = e.c + '|' + e.a; groups[k] = (groups[k] || 0) + 1; });
  const list = Object.keys(groups).filter(k => groups[k] >= 2).sort((a, b) => groups[b] - groups[a]).map(k => { const [c, a] = k.split('|'); return { c, a: Number(a) }; });
  for (const d of DEFAULT_SHORTCUTS) {
    if (list.length >= 6) break;
    if (!list.some(x => x.c === d.c && x.a === d.a)) list.push(d);
  }
  return list.slice(0, 6);
}

/* ---------- Actions ---------- */
function addExpense({ a, c, note, charge, src, ms, yesterday }) {
  const now = new Date();
  let day = today(), t = now.toISOString();
  if (yesterday) { day = addDays(today(), -1); const d = parseDay(day); d.setHours(20, 0, 0, 0); t = d.toISOString(); }
  const k = mk(day);
  month(k).expenses.push({ id: uid(), a, c, day, t, note: note || '', charge: charge || null, src: src || 'keypad', ms: ms || null });
  saveMonth(k);
}
function addIncome({ a, src, next }) {
  const d = today(), k = mk(d);
  month(k).incomes.push({ id: uid(), a, src, day: d, t: new Date().toISOString() });
  saveMonth(k);
  const p = S.profile;
  const resets = noFixed(p) || mainSrcs(p.mode).includes(src);
  if (resets) {
    p.periodStart = d;
    if (!noFixed(p) && mainSrcs(p.mode).includes(src)) p.nextIncome = nextIncomeDate(p, d);
    if (next !== undefined) p.nextIncome = next || null;
    saveProfile();
  }
  return resets;
}
function deposit(a, kind) {
  const g = goal(); if (!g || !a) return;
  const d = today(), k = mk(d);
  month(k).deposits.push({ id: uid(), a, kind, goal: g.id, day: d, t: new Date().toISOString() });
  saveMonth(k);
}
function closeToday() {
  const d = today(), k = mk(d);
  if (allCloses()[d]) return allCloses()[d];
  const b = budgetCalc().b, s = spentOn(d), r = b - s;
  const g = goal();
  const prevBricks = goalStats() ? goalStats().bricks : 0;
  if (r > 0 && g) month(k).deposits.push({ id: uid(), a: r, kind: 'evening', goal: g.id, day: d, t: new Date().toISOString() });
  month(k).closes[d] = { b, s, r, t: new Date().toISOString() };
  saveMonth(k);
  const st = streakInfo();
  if (st.count > (S.profile.record || 0)) { S.profile.record = st.count; saveProfile(); }
  const nowBricks = goalStats() ? goalStats().bricks : 0;
  return { b, s, r, newBricks: Math.max(0, nowBricks - prevBricks) };
}
function adjustBalance(real) {
  const diff = real - balance(); if (!diff) return;
  const d = today(), k = mk(d);
  month(k).adjustments.push({ id: uid(), a: diff, day: d, t: new Date().toISOString(), reason: 'Recalage' });
  saveMonth(k);
}
function findTx(kind, id) {
  for (const k in S.months) { const arr = S.months[k][kind] || []; const i = arr.findIndex(x => x.id === id); if (i >= 0) return { k, arr, i, x: arr[i] }; }
  return null;
}

/* ---------- Rendu : composants ---------- */
function wallHTML(pct, rows, cols, h, animateFrom) {
  const total = rows * cols;
  const cells = x => x > 0 ? Math.min(total, Math.max(1, Math.round(x / 100 * total))) : 0;
  const filled = cells(pct);
  const from = animateFrom == null ? filled : Math.min(filled, cells(animateFrom));
  let html = '<span class="wall" aria-hidden="true">', ni = 0;
  for (let r = 0; r < rows; r++) {
    const fromBottom = rows - 1 - r; const start = fromBottom * cols;
    const offset = r % 2 === 0;
    html += `<span class="r" style="height:${h}px">`;
    const cell = (i, half) => {
      const f = i < filled; const isNew = f && i >= from;
      const cls = 'b' + (half ? ' h' : '') + (f ? ((i * 7 + r * 3) % 5 === 0 ? ' f2' : ' f') : '') + (isNew ? ' new' : '');
      const style = isNew ? ` style="--i:${ni++}"` : '';
      return `<span class="${cls}"${style}></span>`;
    };
    if (offset) {
      html += cell(start, true);
      for (let c = 1; c < cols; c++) html += cell(start + c, false);
      html += cell(start + cols - 1, true);
    } else {
      for (let c = 0; c < cols; c++) html += cell(start + c, false);
    }
    html += '</span>';
  }
  return html + '</span>';
}

/* ---------- Écran : Chantier ---------- */
function viewGoal() {
  const gs = goalStats();
  if (!gs) {
    const done = S.profile.goal && S.profile.goal.done ? S.profile.goal : null;
    return `<main class="shell">
      <h1 class="h1">Mon chantier</h1>
      ${done ? `<div class="card col" style="gap:8px;text-align:center;align-items:center"><span class="eyebrow">Rêve accompli</span><span class="h2">${esc(done.name)}</span><span class="small muted">${F(done.target)} réunis, brique par brique. Bravo.</span></div>` : ''}
      <div class="card col" style="gap:10px"><span class="h2">${done ? 'Prochain rêve ?' : 'Quel est ton rêve ?'}</span><span class="small muted">Donne-lui un nom et un montant. Chaque soir, ce qui reste de ton budget du jour deviendra des briques.</span>
      <button class="btn btn-brick" data-act="new-goal">Commencer un chantier</button></div>
    </main>${navHTML()}`;
  }
  const g = gs.g;
  const steps = [['Fondations', 25], ['Murs', 50], ['Toit', 75], ['Clés', 100]];
  let animFrom = null;
  const seen = S.profile.seenPct == null ? gs.exact : S.profile.seenPct;
  if (seen < gs.exact) animFrom = seen;
  if (Math.abs((S.profile.seenPct || 0) - gs.exact) > 1e-9) { S.profile.seenPct = gs.exact; saveProfile(); }
  const nextStep = steps.find(s => gs.pct < s[1]);
  const toNext = nextStep ? Math.max(0, Math.ceil(g.target * nextStep[1] / 100) - gs.p) : 0;
  const fam = sum(all('expenses').filter(e => e.c === 'transport' && e.day >= addDays(today(), -30)), e => e.a);
  return `<main class="shell">
    <div class="between"><span class="eyebrow">Mon chantier</span><button class="link" data-act="edit-goal">Modifier</button></div>
    <div class="between" style="align-items:flex-end">
      <div class="col" style="gap:2px;min-width:0"><h1 class="display ellipsis" style="font-size:34px;font-weight:800;margin:0;line-height:1.05">${esc(g.name)}</h1><span class="small muted">${F(gs.p)} sur ${F(g.target)}</span></div>
      <span class="display" style="font-size:44px;font-weight:800;color:var(--brick);line-height:1">${gs.pct}&nbsp;%</span>
    </div>
    <div class="card col" style="gap:6px;padding:18px" role="img" aria-label="Mur rempli à ${gs.pct} pour cent">
      <svg width="100%" height="44" viewBox="0 0 300 44" preserveAspectRatio="none" aria-hidden="true"><path d="M8 42L150 4l142 38" fill="none" stroke="${gs.pct >= 75 ? 'var(--brick)' : '#D9C7B6'}" stroke-width="2.5" ${gs.pct >= 75 ? '' : 'stroke-dasharray="7 6"'} stroke-linecap="round" stroke-linejoin="round"/></svg>
      ${wallHTML(gs.exact, 9, 8, 18, animFrom)}
      <div style="height:6px;background:var(--brickDark);border-radius:2px;margin-top:2px"></div>
      <span class="xs muted" style="text-align:center;padding-top:4px">${fmt(gs.bricks)} brique${gs.bricks > 1 ? 's' : ''} posée${gs.bricks > 1 ? 's' : ''} · 1 brique = ${F(gs.v)}</span>
    </div>
    <div class="steps">${steps.map(s => `<div class="s ${gs.pct >= s[1] ? 'done' : (nextStep && nextStep[0] === s[0] ? 'now' : '')}"><i></i><span class="xs" style="font-weight:700">${s[0]}</span><span class="xs muted">${gs.pct >= s[1] ? 'Fait' : 'à ' + s[1] + ' %'}</span></div>`).join('')}</div>
    <div class="row" style="gap:10px;align-items:stretch">
      <div class="stat"><span class="xs muted" style="font-weight:600">${nextStep ? 'Pour atteindre « ' + nextStep[0] + ' »' : 'Objectif'}</span><b>${nextStep ? F(toNext) : 'Atteint !'}</b></div>
      <div class="stat"><span class="xs muted" style="font-weight:600">Clés en main vers</span><b>${gs.left <= 0 ? 'Maintenant' : gs.eta ? roughDate(gs.eta) : '—'}</b></div>
    </div>
    ${!gs.eta && gs.left > 0 ? `<p class="small muted" style="margin:0">${gs.waiting ? 'Ta date apparaîtra après une semaine de briques.' : 'Pose ta première brique pour voir ta date.'}</p>` : ''}
    <div class="row" style="gap:10px">
      <button class="btn btn-brick" data-act="open-deposit" style="flex:1">${I.plus('#fff', 18)} Poser des briques</button>
      <button class="btn btn-ghost" data-act="open-withdraw">Retirer</button>
    </div>
    ${gs.left <= 0 ? `<button class="btn btn-dark btn-block" data-act="finish-goal">Rêve accompli : en commencer un autre</button>` : ''}
    ${fam > 0 ? `<div class="insight"><span style="width:44px;height:44px;border-radius:14px;background:#2E2925;display:flex;align-items:center;justify-content:center;flex-shrink:0">${I.bulb}</span>
      <span class="col" style="gap:3px"><span style="font-weight:600;line-height:1.35">Ton transport sur 30 jours : ${F(fam)}, soit <span style="color:var(--gold)">${fmt(Math.floor(fam / gs.v))} briques</span>.</span><span class="xs" style="color:#C9C1B8">Chaque trajet évité, c’est ${fmt(Math.max(1, Math.round(500 / gs.v)))} brique${Math.round(500 / gs.v) > 1 ? 's' : ''} de plus pour ${esc(g.name)}.</span></span></div>` : ''}
  </main>${navHTML()}`;
}

/* ---------- Écran : Bilan ---------- */
function viewStats() {
  const keys = Object.keys(S.months).concat([mk(today())]).filter((v, i, a) => a.indexOf(v) === i).sort();
  const cur = S.ui.month && keys.includes(S.ui.month) ? S.ui.month : mk(today());
  const m = month(cur);
  const varExp = m.expenses.filter(e => !e.charge);
  const totalVar = sum(varExp, e => e.a);
  const totalCharges = sum(m.expenses.filter(e => e.charge), e => e.a);
  const totalInc = sum(m.incomes, e => e.a);
  const posedM = sum(m.deposits, e => e.a);
  const byCat = {};
  varExp.forEach(e => { byCat[e.c] = (byCat[e.c] || 0) + e.a; });
  const cats = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]);
  const max = cats.length ? byCat[cats[0]] : 1;
  const days = {};
  m.expenses.forEach(e => { (days[e.day] = days[e.day] || []).push(e); });
  const dayKeys = Object.keys(days).sort().reverse();
  const i = keys.indexOf(cur);
  const closesN = Object.keys(m.closes || {}).length;
  return `<main class="shell">
    <div class="between">
      <button class="iconbtn" data-act="month" data-m="${i > 0 ? keys[i - 1] : ''}" ${i > 0 ? '' : 'disabled style="opacity:.35"'} aria-label="Mois précédent">${I.back}</button>
      <h1 class="h1" style="font-size:22px">${monthLabel(cur)}</h1>
      <button class="iconbtn" data-act="month" data-m="${i < keys.length - 1 ? keys[i + 1] : ''}" ${i < keys.length - 1 ? '' : 'disabled style="opacity:.35"'} aria-label="Mois suivant">${I.fwd}</button>
    </div>
    <div class="row" style="gap:10px;align-items:stretch">
      <div class="stat"><span class="xs muted" style="font-weight:600">Dépenses du quotidien</span><b>${F(totalVar)}</b></div>
      <div class="stat"><span class="xs muted" style="font-weight:600">Briques posées</span><b>${F(posedM)}</b></div>
    </div>
    <div class="row" style="gap:10px;align-items:stretch">
      <div class="stat"><span class="xs muted" style="font-weight:600">Charges fixes payées</span><b>${F(totalCharges)}</b></div>
      <div class="stat"><span class="xs muted" style="font-weight:600">Revenus notés</span><b>${F(totalInc)}</b></div>
    </div>
    <p class="small muted" style="margin:0">${closesN} journée${closesN > 1 ? 's' : ''} fermée${closesN > 1 ? 's' : ''} ce mois-ci.</p>
    ${cats.length ? `<section class="card col" style="gap:12px"><h2 class="h2" style="font-size:17px">Par catégorie</h2>
      ${cats.map(c => `<div class="col" style="gap:5px"><div class="between small"><span style="font-weight:600">${esc(catOf(c).n)}</span><span>${F(byCat[c])} · ${Math.round(byCat[c] / totalVar * 100)} %</span></div><div class="catbar"><i style="width:${Math.max(3, Math.round(byCat[c] / max * 100))}%"></i></div></div>`).join('')}
    </section>` : ''}
    ${m.incomes.length ? `<section class="col" style="gap:2px"><h2 class="h2 list-head" style="font-size:17px">Revenus</h2>
      ${m.incomes.slice().sort((a, b) => b.t.localeCompare(a.t)).map(x => `<button class="item" data-act="edit-inc" data-id="${x.id}"><span class="tile" style="background:#E3EFE6;color:#245A33">+</span><span class="grow col" style="gap:1px"><span style="font-weight:600">${esc((INCOME_SRC.find(s => s.id === x.src) || INCOME_SRC[4]).n)}</span><span class="xs muted">${esc(shortDate(x.day))}</span></span><span style="font-weight:600">+${F(x.a)}</span></button>`).join('')}
    </section>` : ''}
    <section class="col" style="gap:2px">
      <h2 class="h2 list-head" style="font-size:17px">Dépenses</h2>
      ${dayKeys.length ? dayKeys.map(dk => `<div class="between small muted" style="padding-top:10px;font-weight:600"><span>${esc(longDate(dk))}</span><span>${F(sum(days[dk].filter(e => !e.charge), e => e.a))}</span></div>` + days[dk].sort((a, b) => b.t.localeCompare(a.t)).map(e => expenseRow(e)).join('')).join('') : `<p class="small muted">Aucune dépense ce mois-ci.</p>`}
    </section>
  </main>${navHTML()}`;
}

/* ---------- Feuilles (plein écran) ---------- */

  return `<div class="pad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '000', '0', 'back'].map(k => `<button type="button" data-act="key" data-k="${k}" aria-label="${k === 'back' ? 'Effacer' : k}">${k === 'back' ? I.back2 : k}</button>`).join('')}</div>`;
}
function sheetExpense() {
  const f = S.ui.form; const amt = Number(f.amount || 0);
  const sg = f.suggestion; const scs = shortcuts();

  const ready = amt > 0 && (f.c || f.charge);
  const left = budgetToday() - spentOn(today());
  return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Ajouter une dépense">

function readSchedule(o, raw) {
  if (o.mode === 'irregulier') return { freq: null, payDay: null, payWeekday: null };
  const day = () => { const d = num(raw); return d >= 1 && d <= 31 ? d : 0; };
  if (!isStudent(o.mode)) { const d = day(); return d ? { freq: 'mois', payDay: d, payWeekday: null } : 'Indique un jour entre 1 et 31.'; }
  if (!o.freq) return 'Choisis à quel rythme tu reçois ton argent.';
  if (o.freq === 'semaine') return o.payWeekday != null ? { freq: 'semaine', payDay: null, payWeekday: o.payWeekday } : 'Choisis le jour de la semaine.';
  if (o.freq === 'mois') { const d = day(); return d ? { freq: 'mois', payDay: d, payWeekday: null } : 'Indique un jour entre 1 et 31.'; }
  return { freq: o.freq, payDay: null, payWeekday: null };
}

      <span class="row"><label class="row xs" style="gap:6px;min-height:44px"><input type="checkbox" data-act="ob-paid" data-i="${i}" ${c.paid ? 'checked' : ''}> payée</label><button class="link" data-act="ob-del-charge" data-i="${i}" aria-label="Retirer ${esc(c.name)}">Retirer</button></span></div>`).join('')}</div>

}
function finishOnboarding(goalData) {
  const f = S.ui.ob; const d = today();
  const charges = f.charges.map(c => ({ id: uid(), name: c.name, amount: c.amount, paid: c.paid }));
  const paidInit = {}; charges.forEach(c => { if (c.paid) paidInit[c.id] = d; delete c.paid; });
  S.profile = {
    v: 1, name: f.name, mode: f.mode, payDay: f.payDay || null, freq: f.freq || null, payWeekday: f.payWeekday != null ? f.payWeekday : null, housing: f.housing || null,
    nextIncome: f.next || null, periodStart: d, createdDay: d,
    charges, chargesPaidInit: paidInit, brickValue: 200, record: 0, seenPct: 0,
    goal: goalData ? { id: uid(), name: goalData.name, target: goalData.target, per: goalData.per || 0, created: d } : null
  };
  const k = mk(d);
  month(k).adjustments.push({ id: uid(), a: Number(f.amount), day: d, t: new Date().toISOString(), reason: 'Départ' });
  saveMonth(k); saveProfile();
  S.ui.ob = null; S.ui.tab = 'home';
  render();
  openSheet('explain');
}

function renderSheet() {
  const el = document.getElementById('sheet');
  const sh = S.ui.sheet;
  if (!sh) { el.innerHTML = ''; document.body.style.overflow = ''; return; }
  document.body.style.overflow = 'hidden';
  const map = {
    expense: sheetExpense, income: sheetIncome, ritual: sheetRitual, 'edit-exp': sheetEditExpense,
    goal: sheetGoalForm, explain: sheetExplain, simple: sheetSimpleForm,
    deposit: () => sheetAmount('deposit'), withdraw: () => sheetAmount('withdraw'), adjust: () => sheetAmount('adjust'),
    export: () => sheetBackup('export'), import: () => sheetBackup('import')
  };
  const scroll = el.querySelector('.sheet') ? el.querySelector('.sheet').scrollTop : 0;
  const same = el.dataset.kind === sh;
  el.innerHTML = `<div class="overlay" ${same ? 'style="animation:none"' : ''}>${map[sh]()}</div>`;
  if (same) { const s = el.querySelector('.sheet'); if (s) { s.style.animation = 'none'; s.scrollTop = scroll; } }

}
function openSheet(kind, form) {
  S.ui.sheet = kind; S.ui.form = form || {};

}
function closeSheet() { S.ui.sheet = null; S.ui.form = {}; document.getElementById('sheet').dataset.kind = ''; render(); }
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');

  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.innerHTML = ''; }, 2600);

function confirmBox(text, okLabel, onOk, danger) {
  const el = document.getElementById('dialog');
  el.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true"><div class="box"><p style="margin:0;line-height:1.5;font-weight:500">${esc(text)}</p>

  el.onclick = ev => {
    const b = ev.target.closest('[data-dlg]'); if (!b && ev.target.classList.contains('dialog')) { el.innerHTML = ''; return; }

}
function promptBox(title, placeholder, onOk) {
  const el = document.getElementById('dialog');
  el.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true"><form class="box" data-form="prompt"><label for="pb" style="font-weight:600">${esc(title)}</label>
    <input class="input" id="pb" required maxlength="24" autocomplete="off" placeholder="${esc(placeholder)}">
    <div class="row" style="gap:10px"><button type="button" class="btn btn-ghost" style="flex:1" data-dlg="no">Annuler</button><button class="btn btn-dark" style="flex:1">Ajouter</button></div></form></div>`;
  el.onclick = ev => { if (ev.target.closest('[data-dlg]') || ev.target.classList.contains('dialog')) el.innerHTML = ''; };
  el.onsubmit = ev => { ev.preventDefault(); const v = document.getElementById('pb').value.trim(); if (!v) return; el.innerHTML = ''; onOk(v); };
  setTimeout(() => { const i = document.getElementById('pb'); if (i) i.focus(); }, 50);
}
const num = v => Number(String(v || '').replace(/[^0-9]/g, '')) || 0;

/* ---------- Événements ---------- */
function onKey(k) {
  const f = S.profile ? S.ui.form : S.ui.ob;
  let a = String(f.amount || '');
  if (k === 'back') a = a.slice(0, -1);
  else if (a.length < 9 && !(a === '' && (k === '0' || k === '000'))) a += k;
  f.amount = a;
  if (S.ui.form && S.ui.sheet === 'expense' && f.charge) { /* montant libre pour une charge */ }
  if (!S.profile) render(); else renderSheet();
}

document.addEventListener('submit', ev => {

      const sc = readSchedule(S.ui.form, v('sf-pay'));
      if (typeof sc === 'string') { toast(sc); return; }
      p.mode = S.ui.form.mode; Object.assign(p, sc);
      const nx = nextIncomeDate(p, today()); if (nx) p.nextIncome = nx;
    }
    saveProfile(); closeSheet(); toast('Enregistré.');
  }
});
/* La sélection du mode dans l'onboarding avec jour de paie : on garde la saisie */
function importData(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { toast('Ce texte n’est pas une sauvegarde Brique.'); return; }
  if (!data || data.app !== 'brique' || !data.profile || !data.months) { toast('Ce texte n’est pas une sauvegarde Brique.'); return; }
  confirmBox('Remplacer tes données actuelles par cette sauvegarde ?', 'Remplacer', () => {
    for (const k in S.months) if (!data.months[k]) Store.remove('m-' + k);
    S.profile = data.profile; S.months = data.months;
    saveProfile(); for (const k in S.months) saveMonth(k);
    closeSheet(); toast('Sauvegarde importée.');
  });
}
async function resetAll() {
  const ids = ['profile'].concat(Object.keys(S.months).map(k => 'm-' + k));
  for (const id of ids) await Store.remove(id);
  S.profile = null; S.months = {}; S.ui = { tab: 'home', sheet: null, form: {}, month: null };
  render();
}
function downloadICS() {
  const d = parseDay(today()); const dt = d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate());
  const url = location.href.split('#')[0];
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Brique//FR', 'BEGIN:VEVENT', 'UID:brique-rituel-' + uid() + '@brique', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z',
    'DTSTART:' + dt + 'T210000', 'DURATION:PT5M', 'RRULE:FREQ=DAILY', 'SUMMARY:Brique : on ferme la journée ?', 'DESCRIPTION:10 secondes pour poser tes briques. ' + url, 'URL:' + url,
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:On ferme la journée ?', 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'brique-rappel-21h.ics';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Ouvre le fichier pour l’ajouter à ton agenda.');
  } catch (e) { toast('Ajoute plutôt une alarme quotidienne à 21 h.'); }
}

/* ---------- Installation (écran d'accueil) ---------- */
let installEvt = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function canInstall() { return !IS_CLAUDE && !isStandalone() && location.protocol !== 'file:' && (!!installEvt || isIOS()); }
function showInstall() {
  if (!canInstall()) return;
  try { if (Date.now() - Number(localStorage.getItem('brique-install-later') || 0) < 3 * 864e5) return; } catch (e) {}
  document.getElementById('install').innerHTML = `<div class="install" role="region" aria-label="Installer l’app"><span class="tile" style="width:40px;height:40px;flex-shrink:0;background:var(--brick);color:#fff;font-weight:800">B</span>
    <div class="grow col" style="gap:1px"><b>Installe Brique</b><span>${installEvt ? 'Ouvre-la d’un tap, même hors ligne.' : 'Partager › Sur l’écran d’accueil'}</span></div>
    <button class="btn btn-brick" data-act="install">${installEvt ? 'Installer' : 'Comment ?'}</button><button class="x" data-act="install-later" aria-label="Plus tard">×</button></div>`;
}
function hideInstall(later) {
  document.getElementById('install').innerHTML = '';
  if (later) { try { localStorage.setItem('brique-install-later', String(Date.now())); } catch (e) {} }
}
async function doInstall() {
  if (installEvt) {
    const e = installEvt; installEvt = null; hideInstall();
    try { e.prompt(); const r = await e.userChoice; if (r && r.outcome !== 'accepted') hideInstall(true); } catch (err) {}
    if (S.profile && S.ui.tab === 'profile' && !S.ui.sheet) render();
  } else if (isIOS()) {
    confirmBox('Sur iPhone, ouvre Brique dans Safari, touche le bouton Partager (le carré avec une flèche), puis « Sur l’écran d’accueil ».', 'Compris', () => hideInstall(true));
  }
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e; showInstall();
  if (S.profile && S.ui.tab === 'profile' && !S.ui.sheet) render();
});
window.addEventListener('appinstalled', () => { installEvt = null; hideInstall(); toast('Brique est installée !'); });

/* ---------- Démarrage ---------- */
async function boot() {
  await Store.init();
  try {
    const docs = await Store.loadAll();
    S.profile = docs.profile || null;
    for (const id in docs) if (id.indexOf('m-') === 0) {
      const m = docs[id];
      S.months[id.slice(2)] = { expenses: m.expenses || [], incomes: m.incomes || [], deposits: m.deposits || [], closes: m.closes || {}, adjustments: m.adjustments || [] };
    }
  } catch (e) {
    document.getElementById('app').innerHTML = `<main class="shell"><div class="loading" style="min-height:60vh"><span class="h2">Ton chantier est injoignable pour le moment.</span><span class="small muted">Vérifie ta connexion, puis réessaie.</span><button class="btn btn-dark" onclick="location.reload()">Réessayer</button></div></main>`;
    return;
  }
  render();
  if (!IS_CLAUDE && 'serviceWorker' in navigator && location.protocol !== 'file:') {
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  }
  if (isIOS()) showInstall();
}
/* Rafraîchit l'écran quand on revient dans l'app (nouvelle journée, heure du rituel) */
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.profile && !S.ui.sheet) render(); });
boot();
</script>
